---
# Prometheus MCP Server — Deployment and Service (Kind)
# Namespace placeholder: PLACEHOLDER_NAMESPACE (replaced by installer at apply time)
#
# PROMETHEUS_MCP_SERVER_PROMETHEUS_URL — URL of the in-cluster Prometheus instance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp-server
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: prometheus-mcp-server
    app.kubernetes.io/component: prometheus-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-mcp-server
  template:
    metadata:
      labels:
        app: prometheus-mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/tjhop/prometheus-mcp-server:latest
          args:
            - --mcp.transport
            - http
            - --web.listen-address
            - ":8080"
          env:
            - name: PROMETHEUS_MCP_SERVER_PROMETHEUS_URL
              value: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp-server
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: prometheus-mcp-server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: prometheus-mcp-server
